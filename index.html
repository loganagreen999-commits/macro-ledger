<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Macro Ledger</title>
<meta name="description" content="A private, offline nutrition tracker: calories, protein, carbs, fat and 14 micronutrients, day by day.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme:light)" content="#F1F4F1">
<meta name="theme-color" media="(prefers-color-scheme:dark)" content="#0D1211">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Macro Ledger">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* self-hosted type — no external requests, works with the network off */
@font-face{font-family:'Fraunces';font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/Fraunces-400.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400 600;font-display:swap;src:url(fonts/IBMPlexSans-400.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/IBMPlexMono-400.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/IBMPlexMono-500.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}

:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --surface-2:#E7ECE7; --sunk:#EDF0EC;
  --line:#D6DDD5; --line-soft:#E4E9E3;
  --ink:#131A16; --ink-2:#586158; --ink-3:#8B948B;
  --accent:#0E6B57; --accent-ink:#0E6B57; --accent-on:#FFFFFF; --accent-soft:#DEEDE7;
  --p:#AC4227; --c:#9C7407; --f:#455F94;
  --p-soft:#F5E2DC; --c-soft:#F4EAD1; --f-soft:#DFE6F2;
  --warn:#A83A22;
  --shadow:0 1px 2px rgba(19,26,22,.05), 0 8px 24px -12px rgba(19,26,22,.18);
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1211; --surface:#151B19; --surface-2:#1D2523; --sunk:#111716;
    --line:#28322F; --line-soft:#202927;
    --ink:#E6EDE9; --ink-2:#98A69F; --ink-3:#6B7973;
    --accent:#4FC1A2; --accent-ink:#4FC1A2; --accent-on:#07201A; --accent-soft:#153029;
    --p:#E58163; --c:#DCAB44; --f:#7F9DD4;
    --p-soft:#2D1A14; --c-soft:#2C2311; --f-soft:#161F2E;
    --warn:#E5714F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1211; --surface:#151B19; --surface-2:#1D2523; --sunk:#111716;
  --line:#28322F; --line-soft:#202927;
  --ink:#E6EDE9; --ink-2:#98A69F; --ink-3:#6B7973;
  --accent:#4FC1A2; --accent-ink:#4FC1A2; --accent-on:#07201A; --accent-soft:#153029;
  --p:#E58163; --c:#DCAB44; --f:#7F9DD4;
  --p-soft:#2D1A14; --c-soft:#2C2311; --f-soft:#161F2E;
  --warn:#E5714F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
html,body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);min-height:100vh;overscroll-behavior-y:none;color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button,input,select,textarea,label,a,[role="tab"]{touch-action:manipulation}
button,[role="tab"]{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:"IBM Plex Mono","SFMono-Regular",monospace;font-variant-numeric:tabular-nums}
.disp{font-family:"Fraunces","Iowan Old Style",Georgia,serif;font-variant-numeric:tabular-nums;font-optical-sizing:auto}

.app{max-width:500px;margin:0 auto;min-height:100vh;
  padding:0 calc(14px + env(safe-area-inset-right)) 176px calc(14px + env(safe-area-inset-left))}

/* ---- header ---- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 0 8px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.mark{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:16px;letter-spacing:.01em}
.mark span{color:var(--accent-ink)}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);border:1px solid transparent}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.datebar{display:flex;align-items:center;justify-content:center;gap:4px;padding:2px 0 14px}
.datebar button.nav{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.datebar button.nav:hover{background:var(--surface-2);color:var(--ink)}
.datebar svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dlabel{min-width:170px;text-align:center;font-weight:600;font-size:15px;letter-spacing:-.01em}
.dlabel em{display:block;font-style:normal;font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);margin-top:-2px}
.dlabel em.past{color:var(--ink-3)}

/* ---- hero ---- */
.hero{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  box-shadow:var(--shadow);padding:18px 18px 16px;margin-bottom:12px}
.kcalrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.kcal{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:52px;line-height:.92;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kcal small{font-family:"IBM Plex Sans",sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-left:8px;letter-spacing:.09em}
.left{text-align:right;font-size:12px;color:var(--ink-2);line-height:1.35}
.left b{display:block;font-size:19px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.left b.over{color:var(--warn)}
.track{height:6px;border-radius:99px;background:var(--sunk);margin:14px 0 16px;overflow:hidden;border:1px solid var(--line-soft)}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s cubic-bezier(.2,.7,.3,1)}
.track i.over{background:var(--warn)}

.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.macro{background:var(--sunk);border-radius:11px;padding:10px 11px 11px;border:1px solid var(--line-soft)}
.macro .lab{font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;display:flex;align-items:center;gap:5px;margin-bottom:5px}
.macro .dot{width:7px;height:7px;border-radius:2px;display:inline-block}
.macro .val{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:19px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.macro .val u{text-decoration:none;font-size:11px;color:var(--ink-3);font-weight:400}
.macro .mt{height:4px;border-radius:99px;background:var(--line-soft);margin-top:8px;overflow:hidden}
.macro .mt i{display:block;height:100%;border-radius:99px;transition:width .35s cubic-bezier(.2,.7,.3,1)}
.m-p .dot,.m-p .mt i{background:var(--p)} .m-p .lab{color:var(--p)}
.m-c .dot,.m-c .mt i{background:var(--c)} .m-c .lab{color:var(--c)}
.m-f .dot,.m-f .mt i{background:var(--f)} .m-f .lab{color:var(--f)}

/* ---- tabs ---- */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--surface-2);border-radius:11px;padding:3px;margin-bottom:14px}

/* ---- water ---- */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.wtop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.wbig{font-family:"Fraunces",Georgia,serif;font-size:34px;font-weight:600;letter-spacing:-.02em;
  line-height:1;font-variant-numeric:tabular-nums}
.wbig small{font-family:inherit;font-size:14px;font-weight:500;color:var(--ink-3);margin-left:6px}
.wleft{text-align:right;font-size:11.5px;color:var(--ink-3);line-height:1.45}
.wleft b{display:block;font-size:14px;color:var(--accent-ink)}
.cups{display:flex;flex-wrap:wrap;gap:5px;margin:-4px 0 14px}
.cup{width:15px;height:19px;border-radius:3px 3px 6px 6px;border:1.5px solid var(--line);background:var(--sunk)}
.cup.on{background:var(--accent);border-color:var(--accent)}
.pours{display:flex;flex-wrap:wrap;gap:7px}
.pours button{flex:1 1 auto;min-width:72px;padding:10px 6px;border-radius:10px;background:var(--accent-soft);
  color:var(--accent-ink);font-size:13px;font-weight:600;border:1px solid transparent}
.pours button:active{transform:scale(.97)}
.pours button.cust{background:var(--sunk);color:var(--ink-2);border-color:var(--line)}
.plist{padding:4px 16px}
.prow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;
  border-bottom:1px solid var(--line-soft);font-size:14px;font-variant-numeric:tabular-nums}
.prow:last-child{border-bottom:0}
.gline{display:flex;align-items:center;gap:10px;padding:12px 16px}
.gline input{width:96px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);font-size:16px;font-variant-numeric:tabular-nums}
.gline span{font-size:13px;color:var(--ink-3)}
.footnote{margin:2px 3px 0;font-size:11.5px;color:var(--ink-3);line-height:1.6}

/* ---- add / scan ---- */
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 0 2px}
.addrow button{display:flex;align-items:center;justify-content:center;gap:7px;padding:13px 8px;
  border-radius:11px;background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:600}
.addrow button:active{transform:scale(.98)}
.addrow svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.scanbody{display:flex;flex-direction:column}
.camwrap{position:relative;width:100%;aspect-ratio:4/3;background:#0b0f0e;border-radius:14px;
  overflow:hidden;margin-bottom:12px}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.aim{position:absolute;left:10%;right:10%;top:34%;height:32%;border:2px solid rgba(255,255,255,.9);
  border-radius:10px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35);pointer-events:none}
.scanmsg{margin:0 3px 10px;font-size:13.5px;color:var(--ink-2);text-align:center;min-height:19px}

/* ---- pasta pass ---- */
.pphead{margin:2px 3px 16px}
.pphead h2{margin:0 0 3px;font-family:"Fraunces",Georgia,serif;font-size:23px;font-weight:600;letter-spacing:-.02em}
.pphead p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.ppbowl label,.card>label{display:block;font-size:10px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);margin:12px 0 5px}
.ppbowl label:first-of-type{margin-top:4px}
.card select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--ink);font-size:16px;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237c8a86' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;background-size:16px;padding-right:32px}
.bwtop{display:flex;align-items:center;justify-content:space-between}
.bwtop b{font-size:13.5px}
.row2{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.card .row2:last-of-type{border-bottom:0}
.row2>span:first-child{color:var(--ink-2);font-size:13.5px}
.step{display:flex;align-items:center;gap:2px;background:var(--sunk);border:1px solid var(--line);
  border-radius:9px;padding:2px;flex-shrink:0}
.step button{width:38px;height:36px;border-radius:7px;font-size:18px;color:var(--accent-ink);
  background:var(--surface);line-height:1}
.step button:active{transform:scale(.94)}
.step span{min-width:52px;text-align:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.mini{width:68px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);
  font-size:16px;text-align:center;font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:14px;cursor:pointer}
.check input{width:19px;height:19px;accent-color:var(--accent)}
.pptot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:16px;margin:18px 0 12px}
.pplist{margin:14px 0 16px;border-top:1px solid var(--line-soft)}
.pplist .prow{font-size:13px;color:var(--ink-2)}
.pplist .prow span:last-child{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.pptot .btn[disabled]{opacity:.45}
.seg button{padding:7px 0;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ---- log ---- */
.meal{margin-bottom:16px}
.mhead{display:flex;align-items:baseline;justify-content:space-between;padding:0 3px 7px;
  border-bottom:1px solid var(--line);margin-bottom:2px}
.mhead h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2)}
.mhead span{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;padding:11px 3px;border-bottom:1px solid var(--line-soft);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface-2)}
.rmain{flex:1;min-width:0}
.rname{font-weight:500;font-size:14.5px;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsub{font-size:11.5px;color:var(--ink-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsub b{color:var(--ink-2);font-weight:500}
.rright{text-align:right;flex-shrink:0}
.rk{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.rm{font-family:"IBM Plex Mono",monospace;font-size:10.5px;margin-top:2px;letter-spacing:-.01em;display:flex;gap:6px;justify-content:flex-end}
.rm i{font-style:normal}
.rm .xp{color:var(--p)} .rm .xc{color:var(--c)} .rm .xf{color:var(--f)}
.addrow{display:flex;align-items:center;gap:7px;padding:9px 3px;color:var(--ink-3);font-size:13px;width:100%}
.addrow:hover{color:var(--accent-ink)}
.addrow svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* ---- micros ---- */
.micros{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.mgroup{font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  padding:13px 15px 6px;background:var(--sunk);border-bottom:1px solid var(--line-soft)}
.mrow{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:10px 15px;border-bottom:1px solid var(--line-soft)}
.mrow:last-child{border-bottom:0}
.mrow .mn{font-size:13.5px;font-weight:500}
.mrow .mv{font-family:"IBM Plex Mono",monospace;font-size:13px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mrow .mv u{text-decoration:none;color:var(--ink-3);font-size:11px}
.mrow .mbar{grid-column:1;height:4px;border-radius:99px;background:var(--sunk);overflow:hidden;align-self:center;margin-top:3px;border:1px solid var(--line-soft)}
.mrow .mbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.mrow .mbar i.cap{background:var(--warn)}
.mrow .mpct{grid-column:2;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.mrow .mpct.cap{color:var(--warn)}
.note{font-size:11.5px;color:var(--ink-3);padding:12px 15px;line-height:1.5;background:var(--sunk)}

/* ---- fab ---- */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));
  z-index:30;background:var(--accent);color:var(--accent-on);border-radius:99px;
  padding:13px 22px 13px 18px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;
  box-shadow:0 6px 20px -6px rgba(14,107,87,.55),0 2px 5px rgba(0,0,0,.15)}
.fab svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.fab:active{transform:translateX(-50%) scale(.96)}

/* ---- sheet ---- */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.42);z-index:40;backdrop-filter:blur(2px);
  animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:41;background:var(--bg);
  border-radius:20px 20px 0 0;max-height:var(--sheetmax,94vh);display:flex;flex-direction:column;
  box-shadow:0 -8px 40px -10px rgba(0,0,0,.4);animation:up .26s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{animation:none}.track i,.macro .mt i{transition:none}}
.sheet.tall{height:var(--sheetmax,94vh)}
.sheet>.inner{max-width:500px;margin:0 auto;width:100%;display:flex;flex-direction:column;min-height:0;flex:1}
.grab{width:36px;height:4px;border-radius:99px;background:var(--line);margin:9px auto 0;flex-shrink:0}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 8px;flex-shrink:0}
.shead h3{margin:0;font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:600;letter-spacing:-.01em}
.sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.link{color:var(--accent-ink);font-size:13.5px;font-weight:600}

.search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:0 12px;margin:0 16px 12px;flex-shrink:0}
.search svg{width:17px;height:17px;stroke:var(--ink-3);fill:none;stroke-width:2;flex-shrink:0}
.search input{flex:1;border:0;background:none;padding:12px 0;font-size:16px;outline:none}
.search input::placeholder{color:var(--ink-3)}
.search button{color:var(--ink-3);font-size:18px;padding:0 2px}

.sectlab{font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  padding:14px 3px 6px;display:flex;justify-content:space-between;align-items:center}
.res{display:flex;align-items:center;gap:12px;padding:11px 3px;border-bottom:1px solid var(--line-soft);width:100%;text-align:left}
.res:active{background:var(--surface-2)}
.chip{display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:1.5px 5px;border-radius:4px;background:var(--accent-soft);color:var(--accent-ink);vertical-align:1px;margin-right:5px}
.chip.mine{background:var(--c-soft);color:var(--c)}
.empty{text-align:center;color:var(--ink-3);font-size:13.5px;padding:34px 20px;line-height:1.6}

/* ---- forms ---- */
.field{margin-bottom:12px}
.field label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.field input,.field select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;font-size:16px;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qty{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.qty button{width:40px;height:40px;border-radius:9px;background:var(--sunk);font-size:20px;font-weight:500;color:var(--ink-2);display:grid;place-items:center}
.qty button:active{background:var(--accent-soft);color:var(--accent-ink)}
.qty input{flex:1;text-align:center;border:0;background:none;font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:500;outline:none;min-width:0}
.qty .unit{font-size:12.5px;color:var(--ink-3);padding-right:10px;text-align:right;max-width:44%;line-height:1.25}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips button{flex:1;min-width:70px;padding:9px 4px;border-radius:9px;background:var(--surface);border:1px solid var(--line);
  font-size:12.5px;font-weight:500;color:var(--ink-2)}
.chips button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn{width:100%;padding:14px;border-radius:12px;background:var(--accent);color:var(--accent-on);font-weight:600;font-size:15px;margin-top:6px}
.btn:active{filter:brightness(.93)}
.btn.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}
.btn.danger{background:var(--surface);color:var(--warn);border:1px solid var(--line)}
.preview{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:14px;margin-bottom:14px}
.preview .pk{font-family:"Fraunces",Georgia,serif;font-size:33px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.preview .pk small{font-family:"IBM Plex Sans",sans-serif;font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-left:6px}
.pmac{display:flex;gap:16px;margin-top:9px;font-family:"IBM Plex Mono",monospace;font-size:13px;font-variant-numeric:tabular-nums}
.pmac span u{text-decoration:none;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:block;font-family:"IBM Plex Sans",sans-serif;font-weight:600}
.pmg{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);
  font-size:11.5px;color:var(--ink-2)}
.pmg div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.pmg b{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
details.more{margin-bottom:12px}
details.more summary{font-size:12.5px;font-weight:600;color:var(--accent-ink);cursor:pointer;padding:8px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ ";font-family:"IBM Plex Mono",monospace}
details.more[open] summary::before{content:"− "}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(148px + env(safe-area-inset-bottom));z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:500;
  box-shadow:0 6px 20px -6px rgba(0,0,0,.5);animation:up2 .2s ease}
@keyframes up2{from{opacity:0;transform:translateX(-50%) translateY(8px)}}


/* ---- bottom tab bar ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);
  border-top:1px solid var(--line);display:flex;
  padding:6px calc(8px + env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-right))}
.tabbar>div{max-width:500px;margin:0 auto;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:10px;
  color:var(--ink-3);font-size:10.5px;font-weight:600;letter-spacing:.03em}
.tabbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="true"]{color:var(--accent-ink)}
.tabbar button[aria-current="true"] svg{stroke-width:2.2}

/* ---- meals (batch cooking) ---- */
.batch{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow);
  padding:15px 16px;margin-bottom:11px;width:100%;text-align:left;display:block}
.batch:active{background:var(--surface-2)}
.btop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:9px}
.bname{font-weight:600;font-size:16px;letter-spacing:-.01em;line-height:1.25}
.bsub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.pill{flex-shrink:0;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 8px;border-radius:99px;white-space:nowrap}
.pill.fresh{background:var(--accent-soft);color:var(--accent-ink)}
.pill.soon{background:var(--c-soft);color:var(--c)}
.pill.gone{background:var(--p-soft);color:var(--p)}
.bmeter{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;border:1px solid var(--line-soft);margin:10px 0 8px}
.bmeter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bmeter i.gone{background:var(--ink-3)}
.bfoot{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bfoot .per{color:var(--ink-3)}
.bfoot b{color:var(--ink);font-weight:500}
.ing{display:flex;align-items:center;gap:10px;padding:9px 3px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.ing:last-of-type{border-bottom:0}
.ing .ii{flex:1;min-width:0}
.ing .ii u{text-decoration:none;display:block;font-size:11px;color:var(--ink-3);margin-top:1px}
.ing .ik{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ing button.x{width:28px;height:28px;border-radius:8px;color:var(--ink-3);font-size:17px;flex-shrink:0;display:grid;place-items:center}
.ing button.x:hover{background:var(--p-soft);color:var(--p)}

/* ---- goals ---- */
.gsec{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;margin-bottom:12px}
.grow{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line-soft)}
.grow:last-child{border-bottom:0}
.grow .gn{flex:1;min-width:0;font-size:13.5px;font-weight:500}
.grow .gn u{text-decoration:none;display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-top:1px}
.grow input{width:88px;flex-shrink:0;text-align:right;background:var(--sunk);border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;font-family:"IBM Plex Mono",monospace;font-size:16px;outline:none;
  font-variant-numeric:tabular-nums}
.grow input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.grow .gu{width:34px;flex-shrink:0;font-size:11px;color:var(--ink-3)}
.limitnote{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--c)}
.autofill{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow);
  padding:16px;margin-bottom:12px}
.autofill h3{margin:0 0 4px;font-family:"Fraunces",Georgia,serif;font-size:17px;font-weight:600;letter-spacing:-.01em}
.autofill p{margin:0 0 14px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.autofill p.sub2{margin:9px 0 0;font-size:11.5px;color:var(--ink-3)}
.working{background:var(--sunk);border-radius:10px;padding:10px 12px;margin:0 0 12px;
  font-size:12.5px;color:var(--ink-2);line-height:1.55}
.working b{color:var(--ink);font-variant-numeric:tabular-nums}
.working:empty{display:none}
.unitsw{display:flex;gap:0;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:2px;margin-bottom:12px;width:fit-content}
.unitsw button{padding:5px 13px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink-3)}
.unitsw button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const foodKey=f=>((f.brand||"")+"|"+f.name+"|"+f.serving).toLowerCase();
const singular=u=>{const s=String(u||"serving").trim();return /s$/i.test(s)&&s.length>2?s.slice(0,-1):s};
const nQty=v=>String(Math.round(v*100)/100);

function totals(list){
  const t=new Array(18).fill(0);
  for(const e of (list||entries())) for(let i=0;i<18;i++) t[i]+=(e.n[i]||0)*e.qty;
  return t;
}

/* ---------------- batches (cook once, eat all week) ---------------- */
function batchTotals(b){
  const t=new Array(18).fill(0);
  for(const g of b.ing) for(let i=0;i<18;i++) t[i]+=(g.n[i]||0)*g.qty;
  return t;
}
function batchPerUnit(b){
  const t=batchTotals(b), q=parseFloat(b.yieldQty)||0;
  return q>0? t.map(v=>v/q) : t.map(()=>0);
}
function batchUsed(id){
  let u=0;
  for(const d in S.days) for(const e of S.days[d]) if(e.batchId===id) u+=e.qty;
  return u;
}
function freshness(b){
  const ms=b.cookedAt+(parseFloat(b.shelfDays)||5)*864e5-Date.now();
  if(ms<=0){
    const days=Math.floor(-ms/864e5);
    return {cls:"gone",label:days<1?"Past its date":"Expired "+days+"d ago",over:true};
  }
  if(ms<864e5) return {cls:"soon",label:Math.max(1,Math.round(ms/36e5))+"h left"};
  const days=Math.ceil(ms/864e5);
  return {cls:days<=2?"soon":"fresh",label:days+" day"+(days===1?"":"s")+" left"};
}
function batchAsFood(b){
  return {name:b.name,brand:"Meal prep",serving:singular(b.yieldUnit),grams:0,
          n:batchPerUnit(b),batchId:b.id,isBatch:true,unitPlural:b.yieldUnit};
}

/* ---------------- search ---------------- */
function searchFoods(q){
  const ql=q.toLowerCase().trim();
  if(!ql)return[];
  const terms=ql.split(/\s+/).filter(Boolean);
  const pool=S.batches.map(batchAsFood)
    .concat(S.foods.map(f=>Object.assign({},f,{custom:true})))
    .concat(FOODS.map(rowToFood));
  const out=[];
  for(const f of pool){
    const name=f.name.toLowerCase(),brand=(f.brand||"").toLowerCase();
    const hay=name+" "+brand;
    if(!terms.every(t=>hay.includes(t)))continue;
    let sc=0;
    if(name.startsWith(ql))sc+=100;
    else if(brand.startsWith(ql))sc+=80;
    else if((brand+" "+name).includes(ql))sc+=45;
    if(name.split(/[\s,]+/).some(w=>w.startsWith(terms[0])))sc+=25;
    if(f.isBatch)sc+=45;
    if(f.custom)sc+=30;
    if(!brand)sc+=8;              /* a bare food word should find the plain food, not a menu item */
    /* ties fall back to the curated order of FOODS, which is stable through sort */
    out.push({f,sc});
  }
  out.sort((a,b)=>b.sc-a.sc);
  return out.slice(0,60).map(x=>x.f);
}
function noteRecent(f){
  if(f.isBatch)return;                 /* meals already have their own tab */
  const k=foodKey(f);
  const r={name:f.name,brand:f.brand||"",serving:f.serving,grams:f.grams||0,n:f.n.slice(),custom:!!f.custom};
  if(f.id)r.id=f.id;
  S.recents=[r].concat(S.recents.filter(x=>foodKey(x)!==k)).slice(0,24);
}

    return '<div class="empty"><b>Cook once, log it all week.</b><br><br>'+

      "you eat gets worked out from there.<br><br>Each meal carries a freshness countdown from the day you cooked it."+
      "<br><br>Tap <b>New meal</b> to build one.</div>";
  const sorted=S.batches.slice().sort((a,b)=>b.cookedAt-a.cookedAt);
  return sorted.map(b=>{
    const fr=freshness(b),pu=batchPerUnit(b);
    const y=parseFloat(b.yieldQty)||0,used=batchUsed(b.id),leftQ=Math.max(0,y-used);
    const unit=leftQ===1?singular(b.yieldUnit):b.yieldUnit;
    return '<button class="batch" data-batch="'+b.id+'">'+

/* Direction of travel. 500 kcal a day is roughly a pound a week either way. */
const DIRS = [
  [-500, "Lose about 1 lb a week"],
  [-250, "Lose about 0.5 lb a week"],
  [0,    "Maintain my weight"],
  [250,  "Gain about 0.5 lb a week"],
  [500,  "Gain about 1 lb a week"]
];

/* Mifflin-St Jeor resting burn, times an activity factor, plus the deficit or surplus. */
function energy(b){
  const kg=+b.kg,cm=+b.cm,age=+b.age,male=b.sex==="male";
  const bmr=10*kg+6.25*cm-5*age+(male?5:-161);
  const tdee=bmr*(+b.act);
  return {bmr:Math.round(bmr), tdee:Math.round(tdee),
          kcal:Math.max(1200,Math.round((tdee+(+b.dir||0))/10)*10)};
}
/* Vitamins and minerals: RDA / AI for age and sex. The three that scale with how much
   you eat key off whatever the calorie goal actually is, so they stay right after a
   hand-edited calorie target. */
function computeMicros(kcal,b){
  const age=+b.age,male=b.sex==="male",g={};
  g[4]=Math.round(kcal/1000*14);                    /* fiber: 14 g per 1000 kcal */
  g[5]=Math.round(kcal*0.10/4);                     /* added sugar ceiling: 10% of energy */
  g[6]=Math.round(kcal*0.10/9);                     /* saturated fat ceiling: 10% of energy */
  g[7]=2300;                                        /* sodium ceiling */
  g[17]=300;                                        /* cholesterol ceiling */
  g[8]=male?3400:2600;                              /* potassium AI */
  g[9]=(age>=71||(age>=51&&!male))?1200:1000;       /* calcium RDA */
  g[10]=(!male&&age<=50)?18:8;                      /* iron RDA */
  g[15]=male?(age<=30?400:420):(age<=30?310:320);   /* magnesium RDA */
  g[16]=male?11:8;                                  /* zinc RDA */
  g[11]=male?900:700;                               /* vitamin A RDA */
  g[12]=male?90:75;                                 /* vitamin C RDA */
  g[13]=age>=71?20:15;                              /* vitamin D RDA */
  g[14]=2.4;                                        /* vitamin B12 RDA */
  return g;
}
function computeGoals(b){
  const kcal=energy(b).kcal;
  const protein=Math.round(1.6*(+b.kg));            /* 1.6 g/kg — the usual active-adult figure */
  const fat=Math.round(kcal*0.25/9);
  const carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
  return Object.assign({0:kcal,1:protein,2:carbs,3:fat},computeMicros(kcal,b));
}
const cmToFtIn=cm=>{const t=Math.round(cm/2.54);return[Math.floor(t/12),t%12]};
const ftInToCm=(ft,inch)=>Math.round(((+ft||0)*12+(+inch||0))*2.54);
const kgToLb=kg=>Math.round(kg*2.20462);
const lbToKg=lb=>Math.round((+lb||0)/2.20462*10)/10;

function workingHTML(b){
  if(!(b.kg>0&&b.cm>0&&b.age>0))return "";
  const e=energy(b), d=+b.dir||0;
  const act=(ACTIVITY.find(a=>Math.abs(a[0]-(+b.act))<0.001)||[0,"?"])[1];
  return "<b>"+fmt(e.bmr)+"</b> kcal at rest &middot; <b>"+fmt(e.tdee)+"</b> kcal "+
    esc(act.toLowerCase())+(d?" &middot; <b>"+(d>0?"+":"")+fmt(d)+"</b> to "+(d>0?"gain":"lose"):"")+
    " &rarr; <b>"+fmt(e.kcal)+"</b> kcal a day";
}

function bindGoals(el){
  el.querySelectorAll("[data-units]").forEach(btn=>btn.onclick=()=>{
    readBody(el); S.body.units=btn.dataset.units; saveGoals(); render();
  });
  const sum=()=>{const s=el.querySelector("#macroSum");
    if(s)s.textContent=fmt(goal(1)*4+goal(2)*4+goal(3)*9)};
  el.querySelectorAll("[data-goal]").forEach(inp=>{
    inp.oninput=()=>{
      const v=parseFloat(inp.value);
      S.goals[inp.dataset.goal]=isFinite(v)&&v>=0?v:0;
      saveGoals(); sum();
    };
    inp.onblur=()=>{inp.value=rnd(goal(inp.dataset.goal),2)};
  });
  const refreshWorking=()=>{const w=el.querySelector("#working");
    if(w)w.innerHTML=workingHTML(S.body)};
  ["bSex","bAge","bAct","bDir","bFt","bIn","bLb","bCm","bKg"].forEach(id=>{
    const n=el.querySelector("#"+id);
    if(n){n.onchange=()=>{readBody(el);saveGoals();refreshWorking()};
          n.oninput=()=>{readBody(el);refreshWorking()};}
  });
  const haveBody=()=>{
    readBody(el);
    if(S.body.kg>0&&S.body.cm>0&&S.body.age>0)return true;
    toast("Fill in age, height and weight first"); return false;
  };
  el.querySelector("#doAutofill").onclick=()=>{
    if(!haveBody())return;
    S.goals=computeGoals(S.body);
    saveGoals(); render();
    toast("Goals set from your measurements");
  };
  el.querySelector("#doMicros").onclick=()=>{
    if(!haveBody())return;
    Object.assign(S.goals,computeMicros(goal(0)||energy(S.body).kcal,S.body));
    saveGoals(); render();
    toast("Micronutrients set; your macros kept");
  };
  el.querySelector("#resetGoals").onclick=()=>{
    MICROS.forEach(m=>S.goals[m.i]=m.dv);
    saveGoals(); render(); toast("Micronutrients reset to Daily Values");
  };
}
function readBody(el){
  const g=id=>{const n=el.querySelector("#"+id);return n?parseFloat(n.value):NaN};
  const sex=el.querySelector("#bSex"), act=el.querySelector("#bAct"), dir=el.querySelector("#bDir");
  if(sex)S.body.sex=sex.value;
  if(act)S.body.act=parseFloat(act.value)||1.55;
  if(dir)S.body.dir=parseFloat(dir.value)||0;
  const age=g("bAge"); if(isFinite(age)&&age>0)S.body.age=age;
  if(S.body.units==="us"){
    const cm=ftInToCm(g("bFt"),g("bIn")); if(cm>0)S.body.cm=cm;
    const kg=lbToKg(g("bLb")); if(kg>0)S.body.kg=kg;
  }else{
    const cm=g("bCm"); if(isFinite(cm)&&cm>0)S.body.cm=cm;
    const kg=g("bKg"); if(isFinite(kg)&&kg>0)S.body.kg=kg;
  }
}

function bindPasta(el){
  const save=()=>{lsSet(LSK.pp,S.pp);render()};
  el.querySelectorAll("[data-pp]").forEach(sel=>sel.onchange=()=>{
    const [k,i]=sel.dataset.pp.split(":");
    if(i!==undefined)S.pp.bowls[+i][k]=sel.value; else S.pp[k]=sel.value;
    if(k==="soup"&&sel.value!=="none"&&!S.pp.soups)S.pp.soups=1;
    if(k==="drink"&&!S.pp.drinks)S.pp.drinks=1;
    save();
  });
  const stepOf=id=>id==="plates"?0.5:id==="shares"?0.25:1;
  el.querySelectorAll("[data-ppp]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.ppp;S.pp[id]=rnd((+S.pp[id]||0)+stepOf(id),2);save();
  });
  el.querySelectorAll("[data-ppm]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.ppm;S.pp[id]=Math.max(0,rnd((+S.pp[id]||0)-stepOf(id),2));save();
  });
  el.querySelectorAll("[data-ppdel]").forEach(b=>b.onclick=()=>{
    S.pp.bowls.splice(+b.dataset.ppdel,1);
    if(!S.pp.bowls.length)S.pp.bowls=[{pasta:"spag",sauce:"mar",topping:"none"}];
    save();
  });
  el.querySelector("#ppAdd").onclick=()=>{
    const last=S.pp.bowls[S.pp.bowls.length-1]||{pasta:"spag",sauce:"mar",topping:"none"};
    S.pp.bowls.push({pasta:last.pasta,sauce:last.sauce,topping:"none"});save();
  };
  const pb=el.querySelector("#ppPerBowl");
  if(pb)pb.onchange=()=>{const v=parseFloat(pb.value);S.pp.perBowl=isFinite(v)&&v>0?v:5;save()};
  const dr=el.querySelector("#ppDressed");
  if(dr)dr.onchange=()=>{S.pp.dressed=dr.checked;save()};
  const ga=el.querySelector("#ppGarlic");
  if(ga)ga.onchange=()=>{S.pp.garlic=ga.checked;save()};
  el.querySelector("#ppReset").onclick=()=>{S.pp=ppDefault();save();toast("Cleared")};
  el.querySelector("#ppLog").onclick=()=>{
    const lines=ppLines(); if(!lines.length)return;
    const meal=mealOfNow(), list=S.days[S.date]||(S.days[S.date]=[]);
    lines.forEach(l=>list.push({id:uid(),name:l.label,brand:"Olive Garden",
      serving:"as eaten",grams:0,qty:1,meal:meal,n:l.n.slice()}));
    saveDay();
    const kcal=ppTotal()[0];
    S.pp=ppDefault();lsSet(LSK.pp,S.pp);
    S.view="day";render();
    toast(fmt(kcal)+" kcal added to "+meal.toLowerCase());
  };
}

/* ---------------- barcode scanner ----------------
   Camera decode happens on the device. The lookup is the one place this app
   touches the network: Open Food Facts, no key, no account. Anything already
   scanned once is stored locally and found again offline.                    */
const OFF_URL = "https://world.openfoodfacts.org/api/v2/product/";
let zxingLoad=null, scanStop=null;

function loadZXing(){
  if(window.ZXing)return Promise.resolve(window.ZXing);
  if(zxingLoad)return zxingLoad;
  zxingLoad=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="vendor/zxing.js";
    s.onload=()=>window.ZXing?res(window.ZXing):rej(new Error("no ZXing"));
    s.onerror=()=>rej(new Error("scanner did not load"));
    document.head.appendChild(s);
    setTimeout(()=>rej(new Error("scanner timed out")),12000);
  }).catch(e=>{zxingLoad=null;throw e});
  return zxingLoad;
}
function stopScanner(){ if(scanStop){try{scanStop()}catch(e){} scanStop=null} }

/* grams out of "1 container (150 g)" or "55g" */
function servingGrams(str){
  const m=String(str||"").match(/([\d.]+)\s*g\b/i);
  return m?Math.round(parseFloat(m[1])*10)/10:0;
}
/* Open Food Facts keeps every nutrient in grams, energy in kcal. */
const OFF_MAP=[
  [0,"energy-kcal",1],[1,"proteins",1],[2,"carbohydrates",1],[3,"fat",1],
  [4,"fiber",1],[5,"sugars",1],[6,"saturated-fat",1],
  [7,"sodium",1000],[8,"potassium",1000],[9,"calcium",1000],[10,"iron",1000],
  [11,"vitamin-a",1e6],[12,"vitamin-c",1000],[13,"vitamin-d",1e6],[14,"vitamin-b12",1e6],
  [15,"magnesium",1000],[16,"zinc",1000],[17,"cholesterol",1000]
];
function offToFood(code,prod){
  const nu=prod.nutriments||{};
  const perServing=nu["energy-kcal_serving"]!=null||nu["proteins_serving"]!=null;
  const suffix=perServing?"_serving":"_100g";
  const n=new Array(18).fill(0);
  let got=0;
  OFF_MAP.forEach(([i,key,mult])=>{
    const v=nu[key+suffix];
    if(typeof v==="number"&&isFinite(v)){n[i]=Math.round(v*mult*100)/100;if(v)got++}
  });
  const brand=(prod.brands||"").split(",")[0].trim();
  return {
    name:(prod.product_name||"").trim(),
    brand:brand,
    serving:perServing?(prod.serving_size||"1 serving"):"100 g",
    grams:perServing?servingGrams(prod.serving_size):100,
    n:n, barcode:code, fields:got
  };
}
function localByBarcode(code){ return S.foods.find(f=>f.barcode===code) }

async function lookupBarcode(code,ctx){
  const known=localByBarcode(code);
  if(known){ closeSheet(); openDetail(Object.assign({},known,{custom:true}),ctx); return }
  scanStatus("Looking up "+code+"…");
  let prod=null,err=null;
  try{
    const r=await fetch(OFF_URL+encodeURIComponent(code)+
      ".json?fields=product_name,brands,serving_size,nutriments");
    if(r.ok){const j=await r.json(); if(j&&j.status!==0&&j.product)prod=j.product}
  }catch(e){ err=e }
  closeSheet();
  if(prod){
    const f=offToFood(code,prod);
    if(!f.name)f.name="Barcode "+code;
    openFoodForm(null,ctx,f);
    toast(f.fields>=4?"Found it — check the panel before saving":"Only partial data — fill in the rest");
  }else{
    openFoodForm(null,ctx,{name:"",brand:"",serving:"1 serving",grams:0,
      n:new Array(18).fill(0),barcode:code});
    toast(err?"No connection — type the panel in":"Not in the database — type the panel in");
  }
}
function scanStatus(t){ const e=document.getElementById("scanMsg"); if(e)e.textContent=t }

function openScanner(ctx){
  ctx=ctx||{mode:"log",meal:mealOfNow()};
  openSheet("Scan a barcode",
    '<div class="sbody scanbody">'+
      '<div class="camwrap"><video id="scanVid" playsinline muted autoplay></video>'+
        '<div class="aim"></div></div>'+
      '<p class="scanmsg" id="scanMsg">Starting the camera…</p>'+
      '<p class="footnote">Point it at the barcode, not the nutrition panel. Numbers come from '+
        "Open Food Facts, a public database anyone can edit — check them against the label before "+
        "you save. Whatever you save is stored on the phone, so the same product scans instantly next time.</p>"+
      '<div class="grid2" style="margin-top:14px">'+
        '<button class="btn ghost" id="scanManual">Type the number</button>'+
        '<button class="btn ghost" id="scanByHand">Add by hand</button></div>'+
    "</div>",
    ()=>{
      const vid=document.getElementById("scanVid");
      document.getElementById("scanManual").onclick=()=>{
        const c=(prompt("Barcode number under the bars")||"").replace(/\D/g,"");
        if(c)lookupBarcode(c,ctx);
      };
      document.getElementById("scanByHand").onclick=()=>{stopScanner();closeSheet();openFoodForm(null,ctx,"")};
      runScan(vid,ctx);
    },
    '<button class="link" id="sheetClose">Close</button>');
}

async function runScan(vid,ctx){
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},
      width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){
    scanStatus(e&&e.name==="NotAllowedError"
      ? "Camera blocked. Allow it in Settings, or type the number."
      : "No camera here. Type the number instead.");
    return;
  }
  let done=false;
  const stopTracks=()=>{stream.getTracks().forEach(t=>t.stop())};
  scanStop=stopTracks;                 /* upgraded below; never left unset */
  vid.srcObject=stream;
  try{ await vid.play() }catch(e){}
  const finish=code=>{ if(done)return; done=true; stopScanner(); lookupBarcode(code,ctx) };

  /* Chrome and Android have a native decoder; Safari does not, so fall back. */
  const Native=window.BarcodeDetector;
  let usedNative=false;
  if(Native){
    try{
      const fmts=await Native.getSupportedFormats();
      const want=["ean_13","ean_8","upc_a","upc_e"].filter(f=>fmts.includes(f));
      if(want.length){
        usedNative=true;
        const det=new Native({formats:want});
        let raf=0;
        const tick=async()=>{
          if(done)return;
          try{ const hits=await det.detect(vid); if(hits&&hits.length)return finish(hits[0].rawValue) }
          catch(e){}
          raf=requestAnimationFrame(tick);
        };
        scanStatus("Hold the barcode in the box");
        raf=requestAnimationFrame(tick);
        if(!done)scanStop=()=>{done=true;cancelAnimationFrame(raf);stopTracks()};
      }
    }catch(e){ usedNative=false }
  }
  if(!usedNative){
    scanStatus("Loading the scanner…");
    let ZX;
    try{ ZX=await loadZXing() }
    catch(e){ scanStatus("Scanner failed to load. Type the number instead."); return }
    const hints=new Map();
    hints.set(ZX.DecodeHintType.POSSIBLE_FORMATS,[
      ZX.BarcodeFormat.EAN_13,ZX.BarcodeFormat.EAN_8,
      ZX.BarcodeFormat.UPC_A,ZX.BarcodeFormat.UPC_E]);
    hints.set(ZX.DecodeHintType.TRY_HARDER,true);
    const reader=new ZX.BrowserMultiFormatReader(hints,{delayBetweenScanAttempts:120});
    scanStatus("Hold the barcode in the box");
    reader.decodeFromStream(stream,vid,(res,err)=>{ if(res)finish(res.getText()) })
      .catch(()=>scanStatus("Could not read it. Type the number instead."));
    if(!done)scanStop=()=>{done=true;try{reader.reset()}catch(e){};stopTracks()};
  }
}

/* ---------------- sheet plumbing ---------------- */
/* iOS overlays the keyboard on top of the layout viewport, so a fixed
   bottom:0 sheet ends up behind it. Track the visual viewport and lift the
   sheet by the keyboard height, sizing it to what is actually visible. */
function fitSheet(){
  const host=document.getElementById("sheetHost");
  if(!host||!host.firstChild)return;
  const vv=window.visualViewport;
  let kb=0,vh=window.innerHeight;
  if(vv){kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);vh=vv.height;}
  host.style.setProperty("--kb",Math.round(kb)+"px");
  host.style.setProperty("--sheetmax",Math.round(vh*0.94)+"px");
}
if(window.visualViewport){
  visualViewport.addEventListener("resize",fitSheet);
  visualViewport.addEventListener("scroll",fitSheet);
}
window.addEventListener("resize",fitSheet);

function openSheet(title,body,mount,rightHTML,cls){
  const host=document.getElementById("sheetHost");
  host.innerHTML=
    '<div class="scrim" id="scrim"></div>'+
    '<div class="sheet'+(cls?" "+cls:"")+'" role="dialog" aria-modal="true"><div class="inner">'+
      '<div class="grab"></div>'+
      '<div class="shead"><h3>'+esc(title)+"</h3><div>"+(rightHTML||'<button class="link" id="sheetClose">Close</button>')+"</div></div>"+
      body+"</div></div>";
  document.getElementById("scrim").onclick=closeSheet;
  const c=document.getElementById("sheetClose"); if(c)c.onclick=closeSheet;
  document.body.style.overflow="hidden";
  fitSheet();
  if(mount)mount(host);
}
function closeSheet(){
  stopScanner();
  document.getElementById("sheetHost").innerHTML="";
  document.body.style.overflow="";
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

/* ---------------- detail / edit sheet ---------------- */
function openDetail(food,ctx,editId){
  ctx=ctx||{mode:"log",meal:mealOfNow()};
  const recipe=ctx.mode==="recipe";
  let qty=food.qty>0?food.qty:1,curMeal=ctx.meal||mealOfNow();
  const remaining=food.batchId?Math.max(0,(parseFloat((S.batches.find(b=>b.id===food.batchId)||{}).yieldQty)||0)-batchUsed(food.batchId)):null;
  openSheet(food.name,
    '<div class="sbody">'+
      (food.brand?'<div class="sectlab" style="padding-top:0">'+esc(food.brand)+
        (remaining!==null?" · "+nQty(remaining)+" left":"")+"</div>":"")+
      '<div class="preview" id="prev"></div>'+
      '<div class="field"><label>'+(recipe?"How much went in — "+esc(food.serving)
          :food.isBatch?"How many "+esc(food.unitPlural||food.serving)
          :"Servings — "+esc(food.serving)+(food.grams?" · "+fmt(food.grams)+" g":""))+"</label>"+
        '<div class="qty"><button id="minus" aria-label="Less">−</button>'+
        '<input id="qty" type="text" inputmode="decimal" value="'+qty+'">'+
        '<button id="plus" aria-label="More">+</button>'+
        '<span class="unit">'+esc(food.serving)+"</span></div></div>"+
      (recipe?"":'<div class="field"><label>Meal</label><div class="chips" id="mealChips">'+
        MEALS.map(m=>'<button data-meal="'+m+'" aria-pressed="'+(m===curMeal)+'">'+m+"</button>").join("")+"</div></div>")+
      '<button class="btn" id="save">'+(recipe?"Add ingredient":editId?"Save changes":"Add to log")+"</button>"+
      (editId?'<button class="btn danger" id="del" style="margin-top:9px">Remove from log</button>':
        (food.custom&&!recipe?'<button class="btn ghost" id="edf" style="margin-top:9px">Edit this food</button>':""))+
    "</div>",
    ()=>{
      const qi=document.getElementById("qty"),prev=document.getElementById("prev");
      const drawPrev=()=>{
        const n=food.n;
        prev.innerHTML='<div class="pk">'+fmt(n[0]*qty)+"<small>kcal</small></div>"+
          '<div class="pmac">'+
            '<span><u>Protein</u>'+fmt(n[1]*qty,1)+" g</span>"+
            '<span><u>Carbs</u>'+fmt(n[2]*qty,1)+" g</span>"+
            '<span><u>Fat</u>'+fmt(n[3]*qty,1)+" g</span></div>"+
          '<div class="pmg">'+MICROS.map(m=>"<div><span>"+m.n+"</span><b>"+fmt(n[m.i]*qty,m.d)+" "+m.u+"</b></div>").join("")+"</div>";
      };
      const setQ=v=>{qty=Math.max(0,Math.round(v*100)/100);qi.value=qty;drawPrev()};
      document.getElementById("minus").onclick=()=>setQ(Math.max(0.25,qty-(qty<=1?0.25:qty<=3?0.5:1)));
      document.getElementById("plus").onclick=()=>setQ(qty+(qty<1?0.25:qty<3?0.5:1));
      qi.oninput=()=>{const v=parseFloat(qi.value);if(!isNaN(v)&&v>=0){qty=v;drawPrev()}};
      qi.onblur=()=>{const v=parseFloat(qi.value);setQ(isNaN(v)||v<=0?1:v)};
      document.querySelectorAll("#mealChips button").forEach(b=>b.onclick=()=>{
        curMeal=b.dataset.meal;
        document.querySelectorAll("#mealChips button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
      });
      document.getElementById("save").onclick=()=>{
        if(!(qty>0))return;
        if(recipe){
          draft.ing.push({name:food.name,brand:food.brand||"",serving:food.serving,
            grams:food.grams||0,qty:qty,n:food.n.slice()});
          openBatchForm();
          toast("Ingredient added");
          return;
        }
        const list=S.days[S.date]||(S.days[S.date]=[]);
        if(editId){
          const e=list.find(x=>x.id===editId);
          if(e){e.qty=qty;e.meal=curMeal}
        }else{
          const e={id:uid(),name:food.name,brand:food.brand||"",serving:food.serving,
            grams:food.grams||0,qty:qty,meal:curMeal,n:food.n.slice()};
          if(food.batchId)e.batchId=food.batchId;
          if(food.unitPlural)e.unitPlural=food.unitPlural;
          list.push(e);
          noteRecent(food);saveMeta();
        }
        saveDay();closeSheet();render();
        toast(editId?"Updated":fmt(food.n[0]*qty)+" kcal added");
      };
      const del=document.getElementById("del");
      if(del)del.onclick=()=>{
        S.days[S.date]=entries().filter(x=>x.id!==editId);
        saveDay();closeSheet();render();toast("Removed");
      };
      const edf=document.getElementById("edf");
      if(edf)edf.onclick=()=>openFoodForm(food,ctx);
      drawPrev();
    });
}
function openEntry(id){
  const e=entries().find(x=>x.id===id);

  const f={name:e.name,brand:e.brand,serving:e.serving,grams:e.grams,n:e.n,qty:e.qty};
  if(e.batchId){f.batchId=e.batchId;f.isBatch=true;f.unitPlural=e.unitPlural}

/* ---------------- custom food form ---------------- */
function openFoodForm(existing,ctx,prefill){
  const pre=(prefill&&typeof prefill==="object")?prefill:null;
  const f=existing||pre||{name:prefill||"",brand:"",serving:"1 serving",grams:0,n:new Array(18).fill(0)};
  const num=(id,lab,val,step)=>'<div class="field"><label>'+lab+'</label><input id="'+id+
    '" type="number" inputmode="decimal" step="'+(step||"any")+'" value="'+(val||val===0?val:"")+'"></div>';
  openSheet(existing?"Edit food":"New food",
    '<div class="sbody">'+
      '<div class="field"><label>Name</label><input id="fName" type="text" value="'+esc(f.name)+'" placeholder="Chicken shawarma"></div>'+
      '<div class="grid2">'+
        '<div class="field"><label>Brand (optional)</label><input id="fBrand" type="text" value="'+esc(f.brand||"")+'" placeholder="Trader Joe&#39;s"></div>'+
        '<div class="field"><label>Serving size</label><input id="fServ" type="text" value="'+esc(f.serving)+'" placeholder="1 cup"></div></div>'+
      num("fGrams","Grams per serving (optional)",f.grams||"")+
      '<div class="sectlab" style="padding-left:0">Per serving</div>'+
      '<div class="grid2">'+num("n0","Calories",f.n[0])+num("n1","Protein (g)",f.n[1])+"</div>"+
      '<div class="grid2">'+num("n2","Carbs (g)",f.n[2])+num("n3","Fat (g)",f.n[3])+"</div>"+
      '<details class="more"><summary>Micronutrients (optional)</summary><div class="grid2">'+
        MICROS.map(m=>num("n"+m.i,m.n+" ("+m.u+")",f.n[m.i])).join("")+"</div></details>"+
      '<button class="btn" id="fSave">'+(existing?"Save food":"Save and use it")+"</button>"+
      (existing&&existing.id?'<button class="btn danger" id="fDel" style="margin-top:9px">Delete this food</button>':"")+
    "</div>",
    ()=>{
      document.getElementById("fSave").onclick=()=>{
        const g=id=>{const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v};
        const name=document.getElementById("fName").value.trim();
        if(!name){toast("Give the food a name");return}
        const n=new Array(18).fill(0);
        n[0]=g("n0");n[1]=g("n1");n[2]=g("n2");n[3]=g("n3");
        MICROS.forEach(m=>n[m.i]=g("n"+m.i));
        const food={id:(existing&&existing.id)||uid(),name:name,
          brand:document.getElementById("fBrand").value.trim(),
          serving:document.getElementById("fServ").value.trim()||"1 serving",
          grams:g("fGrams"),n:n,custom:true};
        const bc=(existing&&existing.barcode)||(pre&&pre.barcode);
        if(bc)food.barcode=bc;
        const ix=S.foods.findIndex(x=>x.id===food.id);
        if(ix>=0)S.foods[ix]=food;else S.foods.unshift(food);
        saveMeta();
        if(existing){closeSheet();render();toast("Food saved")}
        else openDetail(food,ctx||{mode:"log",meal:mealOfNow()});
      };
      const d=document.getElementById("fDel");
      if(d)d.onclick=()=>{
        S.foods=S.foods.filter(x=>x.id!==existing.id);
        saveMeta();closeSheet();render();toast("Food deleted");
      };
      setTimeout(()=>{const el=document.getElementById("fName");if(el&&!el.value)el.focus()},120);
    });
}

/* ---------------- meal prep: build a batch, then eat it down ---------------- */
let draft=null;   /* the batch being built; survives the ingredient search sheet */

function newDraft(){
  return {id:uid(),name:"",cookedAt:Date.now(),shelfDays:5,yieldQty:6,yieldUnit:"cups",ing:[]};
}
function openBatchForm(existing){
  if(existing)draft=JSON.parse(JSON.stringify(existing));
  else if(!draft)draft=newDraft();
  const editing=S.batches.some(b=>b.id===draft.id);
  const tot=batchTotals(draft),y=parseFloat(draft.yieldQty)||0;
  const pu=y>0?tot.map(v=>v/y):tot.map(()=>0);
  openSheet(editing?"Edit meal":"New meal",
    '<div class="sbody">'+
      '<div class="field"><label>What did you make</label>'+
        '<input id="mName" type="text" value="'+esc(draft.name)+'" placeholder="Chicken and rice"></div>'+

      '<div class="sectlab" style="padding-left:0">Everything that went in'+
        '<button class="link" id="addIng">+ Add ingredient</button></div>'+
      (draft.ing.length
        ? draft.ing.map((g,i)=>'<div class="ing"><div class="ii">'+esc(g.name)+
            "<u>"+(g.brand?esc(g.brand)+" · ":"")+nQty(g.qty)+" × "+esc(g.serving)+"</u></div>"+
            '<span class="ik">'+fmt(g.n[0]*g.qty)+"</span>"+
            '<button class="x" data-rm="'+i+'" aria-label="Remove">×</button></div>').join("")
        : '<div class="empty" style="padding:22px 10px">No ingredients yet.</div>')+

      '<div class="sectlab" style="padding-left:0">How much it made</div>'+
      '<div class="grid2">'+
        '<div class="field"><label>Amount</label><input id="mYield" type="number" inputmode="decimal" step="any" value="'+draft.yieldQty+'"></div>'+
        '<div class="field"><label>Measured in</label><input id="mUnit" type="text" value="'+esc(draft.yieldUnit)+'" placeholder="cups"></div>'+
      "</div>"+
      '<div class="preview" id="mPrev">'+
        '<div class="pk">'+fmt(pu[0])+'<small>kcal per '+esc(singular(draft.yieldUnit))+"</small></div>"+
        '<div class="pmac"><span><u>Protein</u>'+fmt(pu[1],1)+" g</span>"+
          '<span><u>Carbs</u>'+fmt(pu[2],1)+" g</span>"+
          '<span><u>Fat</u>'+fmt(pu[3],1)+" g</span></div>"+
        '<div class="pmg"><div><span>Whole batch</span><b>'+fmt(tot[0])+" kcal</b></div>"+
          "<div><span>Ingredients</span><b>"+draft.ing.length+"</b></div></div>"+
      "</div>"+

      '<div class="sectlab" style="padding-left:0">Freshness</div>'+
      '<div class="grid2">'+
        '<div class="field"><label>Cooked on</label><input id="mDate" type="date" value="'+dkey(new Date(draft.cookedAt))+'"></div>'+
        '<div class="field"><label>Keeps for (days)</label><input id="mShelf" type="number" inputmode="numeric" step="1" value="'+draft.shelfDays+'"></div>'+
      "</div>"+
      '<button class="btn" id="mSave">'+(editing?"Save meal":"Save meal")+"</button>"+
      (editing?'<button class="btn danger" id="mDel" style="margin-top:9px">Delete this meal</button>':"")+
    "</div>",
    ()=>{
      const read=()=>{
        draft.name=document.getElementById("mName").value;
        draft.yieldUnit=document.getElementById("mUnit").value.trim()||"servings";
        const y=parseFloat(document.getElementById("mYield").value);
        draft.yieldQty=isFinite(y)&&y>0?y:1;
        const sh=parseFloat(document.getElementById("mShelf").value);
        draft.shelfDays=isFinite(sh)&&sh>0?sh:5;
        const dv=document.getElementById("mDate").value;
        if(dv){
          const picked=parseKey(dv), today=new Date();
          draft.cookedAt=dkey(today)===dv?Date.now():picked.getTime()+12*36e5;
        }
      };
      ["mName","mYield","mUnit","mShelf","mDate"].forEach(id=>{
        document.getElementById(id).onchange=()=>{read();openBatchForm()};
      });
      document.getElementById("addIng").onclick=()=>{read();openSearch({mode:"recipe"})};
      document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{
        read();draft.ing.splice(+b.dataset.rm,1);openBatchForm();
      });
      document.getElementById("mSave").onclick=()=>{
        read();
        if(!draft.name.trim()){toast("Give the meal a name");return}
        if(!draft.ing.length){toast("Add at least one ingredient");return}
        const ix=S.batches.findIndex(b=>b.id===draft.id);
        if(ix>=0)S.batches[ix]=draft;else S.batches.unshift(draft);
        saveBatches();draft=null;
        S.view="meals";closeSheet();render();toast("Meal saved");
      };
      const del=document.getElementById("mDel");
      if(del)del.onclick=()=>{
        if(!window.confirm("Delete this meal? Anything already logged from it stays in your log."))return;
        S.batches=S.batches.filter(b=>b.id!==draft.id);
        saveBatches();draft=null;closeSheet();render();toast("Meal deleted");
      };
    });
}

function openBatch(id){
  const b=S.batches.find(x=>x.id===id);
  if(!b)return;
  const fr=freshness(b),tot=batchTotals(b),pu=batchPerUnit(b);
  const y=parseFloat(b.yieldQty)||0,used=batchUsed(b.id),left=Math.max(0,y-used);
  openSheet(b.name,
    '<div class="sbody">'+
      '<div class="sectlab" style="padding-top:0">Cooked '+
        esc(new Date(b.cookedAt).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}))+
        " · <span class=\"pill "+fr.cls+'">'+esc(fr.label)+"</span></div>"+
      '<div class="preview">'+
        '<div class="pk">'+fmt(pu[0])+'<small>kcal per '+esc(singular(b.yieldUnit))+"</small></div>"+
        '<div class="pmac"><span><u>Protein</u>'+fmt(pu[1],1)+" g</span>"+
          '<span><u>Carbs</u>'+fmt(pu[2],1)+" g</span>"+
          '<span><u>Fat</u>'+fmt(pu[3],1)+" g</span></div>"+
        '<div class="pmg">'+MICROS.map(m=>"<div><span>"+m.n+"</span><b>"+fmt(pu[m.i],m.d)+" "+m.u+"</b></div>").join("")+"</div>"+
      "</div>"+
      '<div class="gsec"><div class="mgroup">What is left</div>'+
        '<div class="mrow"><div class="mn">'+nQty(left)+" "+esc(left===1?singular(b.yieldUnit):b.yieldUnit)+" of "+nQty(y)+"</div>"+
        '<div class="mv">'+fmt(pu[0]*left)+" <u>kcal</u></div>"+
        '<div class="mbar"><i class="'+(fr.over?"gone":"")+'" style="width:'+(y>0?Math.min(100,(left/y)*100):0)+'%"></i></div>'+
        '<div class="mpct">'+(y>0?Math.round((left/y)*100):0)+"%</div></div></div>"+
      '<button class="btn" id="eat">Log some of this</button>'+
      '<div class="sectlab" style="padding-left:0">Ingredients · whole batch '+fmt(tot[0])+" kcal</div>"+
      b.ing.map(g=>'<div class="ing"><div class="ii">'+esc(g.name)+
        "<u>"+(g.brand?esc(g.brand)+" · ":"")+nQty(g.qty)+" × "+esc(g.serving)+"</u></div>"+
        '<span class="ik">'+fmt(g.n[0]*g.qty)+" kcal</span></div>").join("")+
      '<button class="btn ghost" id="editB" style="margin-top:14px">Edit this meal</button>'+
    "</div>",
    ()=>{
      document.getElementById("eat").onclick=()=>openDetail(batchAsFood(b),{mode:"log",meal:mealOfNow()});
      document.getElementById("editB").onclick=()=>openBatchForm(b);
    });
}

/* ---------------- data sheet ---------------- */
function openSettings(){
  const days=Object.keys(S.days).filter(d=>entries(d).length).length;
  openSheet("Your data",
    '<div class="sbody">'+
      '<div class="note" style="border-radius:10px;margin-bottom:14px">'+
        days+" day"+(days===1?"":"s")+" logged · "+S.foods.length+" custom food"+(S.foods.length===1?"":"s")+
        " · "+S.batches.length+" meal"+(S.batches.length===1?"":"s")+
        " · stored on this device, nowhere else</div>"+
      '<button class="btn ghost" id="tCopy">Download a backup file</button>'+
      '<button class="btn ghost" id="tImport" style="margin-top:9px">Restore from a backup file</button>'+
      '<input type="file" id="tFile" accept="application/json,.json" hidden>'+
      '<button class="btn danger" id="tWipe" style="margin-top:9px">Erase everything</button>'+
    "</div>",
    ()=>{
      document.getElementById("tCopy").onclick=()=>{
        const data=JSON.stringify({app:"macro-ledger",v:2,exported:new Date().toISOString(),
          days:S.days,foods:S.foods,recents:S.recents,batches:S.batches,goals:S.goals,body:S.body},null,1);
        const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
        const a=document.createElement("a");
        a.href=url;a.download="macro-ledger-"+dkey(new Date())+".json";
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),4000);
        toast("Backup downloaded");
      };
      const restore=txt=>{
        try{
          const d=JSON.parse(txt);
          if(!d||typeof d!=="object"||(!d.days&&!d.foods))throw new Error("shape");
          if(d.days)S.days=d.days;
          if(d.foods)S.foods=d.foods;
          if(d.recents)S.recents=d.recents;
          if(d.batches)S.batches=d.batches;
          if(d.body)S.body=Object.assign(S.body,d.body);
          if(d.goals)Object.keys(d.goals).forEach(k=>{const v=parseFloat(d.goals[k]);if(isFinite(v))S.goals[k]=v});
          else if(d.targets){const t=d.targets;                 /* a v1 backup */
            if(t.kcal)S.goals[0]=t.kcal;if(t.p)S.goals[1]=t.p;if(t.c)S.goals[2]=t.c;if(t.f)S.goals[3]=t.f}
          saveDay();saveMeta();saveBatches();saveGoals();
          closeSheet();render();toast("Data restored");
        }catch(e){toast("That file was not a Macro Ledger backup")}
      };
      document.getElementById("tImport").onclick=()=>document.getElementById("tFile").click();
      document.getElementById("tFile").onchange=ev=>{
        const f=ev.target.files&&ev.target.files[0];
        if(!f)return;
        const rd=new FileReader();
        rd.onload=()=>restore(String(rd.result));
        rd.onerror=()=>toast("Could not read that file");
        rd.readAsText(f);
      };
      document.getElementById("tWipe").onclick=()=>{
        if(!window.confirm("Erase every logged day, custom food and saved meal? This cannot be undone."))return;
        S.days={};S.foods=[];S.recents=[];S.batches=[];
        saveDay();saveMeta();saveBatches();
        closeSheet();render();toast("Everything erased");
      };
    });
}

/* ---------------- wiring ---------------- */
document.getElementById("fab").onclick=()=>{
  if(S.view==="meals"){draft=newDraft();openBatchForm()}
  else openSearch({mode:"log"});
};
document.getElementById("btnSettings").onclick=openSettings;
["day","meals","pasta","goals"].forEach(v=>
  document.getElementById("nav"+v).onclick=()=>{S.view=v;window.scrollTo(0,0);render()});

render();

/* offline: cache the whole app on first load, then never need the network */
if("serviceWorker" in navigator)
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
